<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pilotar pelo celular — Robótica 8º ano</title>
<style>
  :root {
    --fundo: #0E2129;
    --painel: #16323C;
    --linha: #24505E;
    --sinal: #F2B705;
    --claro: #E6EEF0;
    --apagado: #7C9AA5;
    --alerta: #D64933;
    --ok: #4CB963;
    --unidade: min(13vh, 12vw);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--fundo); color: var(--claro);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  body {
    display: flex; flex-direction: column;
    padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right))
             max(8px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    gap: 8px;
  }

  header { display: flex; align-items: center; gap: 9px; flex: none; }
  .bolinha { width: 10px; height: 10px; border-radius: 50%; background: var(--alerta); flex: none; }
  .bolinha.ligado { background: var(--ok); }
  h1 { font-size: 13.5px; font-weight: 650; margin: 0; flex: 1; white-space: nowrap;
       overflow: hidden; text-overflow: ellipsis; }
  #recado { font-size: 11.5px; color: var(--apagado); flex: 2; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis; text-align: right; }
  #senha {
    font: inherit; font-size: 13px; font-weight: 650; letter-spacing: .06em;
    width: 84px; flex: none; text-align: center; text-transform: uppercase;
    padding: 7px 6px; border-radius: 6px; border: 2px solid var(--linha);
    background: var(--painel); color: var(--claro); touch-action: auto;
  }
  #senha:focus { outline: none; border-color: var(--sinal); }
  #conectar {
    font: inherit; font-size: 13px; font-weight: 650; padding: 8px 14px; flex: none;
    border-radius: 6px; border: 2px solid var(--sinal);
    background: var(--sinal); color: #10242B;
  }
  #conectar.desligar { background: var(--painel); color: var(--claro); border-color: var(--linha); }

  main {
    flex: 1; min-height: 0; display: grid; gap: 10px;
    grid-template-columns: auto 1fr auto;
    align-items: center;
  }

  /* ─── direcional ─── */
  .cruz {
    display: grid; gap: 7px;
    grid-template-columns: repeat(3, var(--unidade));
    grid-template-rows: repeat(2, var(--unidade));
    grid-template-areas: ". cima ." "esq baixo dir";
  }
  .dpad {
    border-radius: 13px; border: 2px solid var(--linha); background: var(--painel);
    display: grid; place-items: center; gap: 1px;
  }
  .dpad .seta { font-size: calc(var(--unidade) * .38); line-height: 1; }
  .dpad .nome { font-size: calc(var(--unidade) * .12); color: var(--apagado); }
  .dpad.ativa { background: var(--sinal); border-color: var(--sinal); color: #10242B; }
  .dpad.ativa .nome { color: #2C1F00; }
  #d-cima { grid-area: cima; } #d-esq { grid-area: esq; }
  #d-baixo { grid-area: baixo; } #d-dir { grid-area: dir; }

  /* ─── centro ─── */
  .meio { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .medidor .topo {
    display: flex; justify-content: space-between;
    font-size: 10.5px; color: var(--apagado); margin-bottom: 3px;
  }
  .medidor .topo b { color: var(--claro); font-variant-numeric: tabular-nums; }
  .trilho {
    position: relative; height: 13px; border-radius: 3px;
    background: var(--painel); border: 2px solid var(--linha); overflow: hidden;
  }
  .trilho::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0;
                   width: 2px; background: var(--linha); }
  .preenche { position: absolute; top: 0; bottom: 0; left: 50%; width: 0; background: var(--sinal); }
  .preenche.re { background: var(--alerta); }

  .slider label {
    display: flex; justify-content: space-between;
    font-size: 10.5px; color: var(--apagado); margin-bottom: 1px;
  }
  .slider label b { color: var(--claro); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; margin: 0; accent-color: var(--sinal); touch-action: auto; }

  /* ─── ações ─── */
  .acoes {
    display: grid; gap: 7px;
    grid-template-columns: repeat(2, calc(var(--unidade) * 1.15));
    grid-template-rows: repeat(2, calc(var(--unidade) * .95));
  }
  .acoes button {
    font: inherit; font-size: calc(var(--unidade) * .15); font-weight: 650;
    border-radius: 13px; border: 2px solid var(--linha);
    background: var(--painel); color: var(--claro); padding: 4px;
    line-height: 1.25;
  }
  .acoes button:disabled { opacity: .4; }
  .acoes button b { font-size: calc(var(--unidade) * .2); color: var(--sinal); }
  .acoes button span { font-size: calc(var(--unidade) * .13); color: var(--apagado); }
  .acoes button.ativo { background: var(--sinal); color: #10242B; }
  .acoes button.ativo b, .acoes button.ativo span { color: #2C1F00; }
  .acoes .parar { border-color: var(--alerta); color: #FFBDB3; }

  /* ─── celular em pé: empilha ─── */
  @media (orientation: portrait) {
    :root { --unidade: min(17vh, 25vw); }
    main { grid-template-columns: 1fr; grid-template-rows: auto auto auto; gap: 14px; }
    .cruz, .acoes { justify-content: center; margin: 0 auto; }
    .acoes { grid-template-columns: repeat(2, 1fr); width: 100%; }
    .meio { order: -1; }
    #recado { flex: none; width: 100%; text-align: left; order: 3; white-space: normal; }
    header { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<header>
  <span class="bolinha" id="bolinha"></span>
  <h1 id="titulo">Desconectado</h1>
  <span id="recado">Ligue o robô e toque em Conectar.</span>
  <input id="senha" type="text" placeholder="senha" maxlength="12" autocomplete="off"
         autocapitalize="characters" spellcheck="false">
  <button id="conectar">Conectar</button>
</header>

<main>
  <div class="cruz">
    <div class="dpad" id="d-cima"  data-k="w"><span class="seta">▲</span><span class="nome">frente</span></div>
    <div class="dpad" id="d-esq"   data-k="a"><span class="seta">◀</span><span class="nome">girar</span></div>
    <div class="dpad" id="d-baixo" data-k="s"><span class="seta">▼</span><span class="nome">ré</span></div>
    <div class="dpad" id="d-dir"   data-k="d"><span class="seta">▶</span><span class="nome">girar</span></div>
  </div>

  <div class="meio">
    <div class="medidor">
      <div class="topo"><span>Motor esquerdo</span><b id="v-esq">0</b></div>
      <div class="trilho"><div class="preenche" id="b-esq"></div></div>
    </div>
    <div class="medidor">
      <div class="topo"><span>Motor direito</span><b id="v-dir">0</b></div>
      <div class="trilho"><div class="preenche" id="b-dir"></div></div>
    </div>
    <div class="slider">
      <label>Velocidade <b id="n-vel">255</b></label>
      <input type="range" id="s-vel" min="80" max="255" value="255">
    </div>
    <div class="slider">
      <label>Força do giro <b id="n-giro">140</b></label>
      <input type="range" id="s-giro" min="40" max="255" value="140">
    </div>
  </div>

  <div class="acoes">
    <button id="bt-a" disabled><b>A</b><br><span id="rot-a">—</span></button>
    <button id="bt-b" disabled><b>B</b><br><span id="rot-b">—</span></button>
    <button id="bt-ab" disabled><b>A+B</b><br><span id="rot-ab">—</span></button>
    <button id="parar" class="parar" disabled>Parar</button>
  </div>
</main>

<script>
const SERVICO = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';

// O site pode montar o endereço com a senha e o nome do micro:bit já dentro:
//   ...?senha=K7Q2&nome=zuvit
const url = new URLSearchParams(location.search);
const NOME_ROBO = (url.get('nome') || '').trim();

// O site monta o endereço com o que cada botão faz nesta equipe:
//   ...?ba=Turbo&bb=Coreografia 1&bab=Empinada
const rotulos = {
  'rot-a':  url.get('ba')  || 'ação 1',
  'rot-b':  url.get('bb')  || 'ação 2',
  'rot-ab': url.get('bab') || 'ação 3'
};
let dispositivo = null, escrita = null, notifica = null;
let ligado = false, relogio = null, liberado = false;
let ultimoEnviado = '', ultimaVez = 0;
const teclas = { w:false, a:false, s:false, d:false };

const $ = id => document.getElementById(id);
const recado = t => { $('recado').textContent = t; };
const acoes = ['bt-a','bt-b','bt-ab','parar'];

function estado(on, texto) {
  ligado = on;
  $('bolinha').classList.toggle('ligado', on);
  $('titulo').textContent = texto;
  $('conectar').textContent = on ? 'Sair' : 'Conectar';
  $('conectar').classList.toggle('desligar', on);
  acoes.forEach(i => $(i).disabled = !on);
}

async function conectar() {
  if (!navigator.bluetooth) {
    recado('Sem Bluetooth neste navegador. Use o Chrome no Android.');
    return;
  }
  try {
    const senha = $('senha').value.trim().toUpperCase();
    if (!senha) {
      recado('Digite a senha da sua equipe antes de conectar.');
      $('senha').focus();
      return;
    }

    recado('Procurando o micro:bit...');
    // com o nome no endereço, a lista mostra só o robô da equipe
    const alvo = NOME_ROBO
      ? 'BBC micro:bit [' + NOME_ROBO + ']'
      : 'BBC micro:bit';
    dispositivo = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: alvo }],
      optionalServices: [SERVICO]
    });
    dispositivo.addEventListener('gattserverdisconnected', caiu);

    const servidor = await dispositivo.gatt.connect();
    const servico = await servidor.getPrimaryService(SERVICO);
    const lista = await servico.getCharacteristics();

    for (const c of lista) {
      if (c.properties.write || c.properties.writeWithoutResponse) escrita = c;
      if (c.properties.notify) notifica = c;
    }
    if (!escrita) throw new Error('não achei por onde enviar os comandos');

    if (notifica) {
      await notifica.startNotifications();
      notifica.addEventListener('characteristicvaluechanged', e => {
        const texto = new TextDecoder().decode(e.target.value).trim();
        if (texto === 'FIM') recado('A coreografia terminou.');
        if (texto === 'OK') {
          liberado = true;
          estado(true, 'Conectado');
          recado('Senha aceita. Segure os botões para pilotar.');
        }
        if (texto === 'NAO') {
          liberado = false;
          recado('Senha errada. Este robô é de outra equipe.');
          desconectar();
        }
      });
    }

    estado(true, 'Conferindo a senha...');
    recado('Conectado. Conferindo a senha...');
    await mandar('k' + senha);
    await mandar('v' + $('s-vel').value);
    await mandar('g' + $('s-giro').value);
    ultimoEnviado = '';
    relogio = setInterval(passo, 40);
  } catch (e) {
    recado('Não deu para conectar: ' + e.message);
  }
}

function caiu() {
  clearInterval(relogio); relogio = null;
  escrita = null; notifica = null; liberado = false;
  estado(false, 'Desconectado');
  recado('O robô se soltou. Toque em Conectar para voltar.');
}

async function desconectar() {
  try { await mandar('5'); } catch (e) {}
  if (dispositivo && dispositivo.gatt.connected) dispositivo.gatt.disconnect();
  caiu();
}

let fila = Promise.resolve();
function mandar(texto) {
  if (!escrita) return Promise.resolve();
  fila = fila.then(() =>
    escrita.writeValue(new TextEncoder().encode(texto + '\n')).catch(() => {})
  );
  return fila;
}

function digito() {
  const f = teclas.w ? 1 : (teclas.s ? -1 : 0);
  const c = teclas.d ? 1 : (teclas.a ? -1 : 0);
  if (f === 1)  return c === -1 ? '7' : (c === 1 ? '9' : '8');
  if (f === -1) return c === -1 ? '1' : (c === 1 ? '3' : '2');
  return c === -1 ? '4' : (c === 1 ? '6' : '5');
}

function passo() {
  const d = digito();
  const agora = Date.now();
  if (d !== ultimoEnviado || agora - ultimaVez > 300) {
    ultimoEnviado = d;
    ultimaVez = agora;
    mandar(d);
    pintar(d);
  }
}

function pintar(d) {
  const VEL = +$('s-vel').value, GIRO = +$('s-giro').value;
  let esq, dir;
  if (d === '4') { esq = -GIRO; dir = GIRO; }
  else if (d === '6') { esq = GIRO; dir = -GIRO; }
  else {
    let f = 0, c = 0;
    if ('789'.includes(d)) f = VEL;
    if ('123'.includes(d)) f = -VEL;
    if ('71'.includes(d)) c = -GIRO;
    if ('93'.includes(d)) c = GIRO;
    esq = Math.max(-255, Math.min(255, f + c));
    dir = Math.max(-255, Math.min(255, f - c));
  }
  $('v-esq').textContent = esq;
  $('v-dir').textContent = dir;
  [['b-esq', esq], ['b-dir', dir]].forEach(([id, v]) => {
    const el = $(id);
    el.style.width = (Math.abs(v) / 255 * 50) + '%';
    el.style.transform = v < 0 ? 'translateX(-100%)' : 'none';
    el.classList.toggle('re', v < 0);
  });
}

document.querySelectorAll('.dpad').forEach(el => {
  const k = el.dataset.k;
  const liga = e => {
    e.preventDefault();
    if (!teclas[k]) { teclas[k] = true; el.classList.add('ativa'); passo(); }
  };
  const desliga = e => {
    e.preventDefault();
    if (teclas[k]) { teclas[k] = false; el.classList.remove('ativa'); passo(); }
  };
  el.addEventListener('pointerdown', e => { el.setPointerCapture(e.pointerId); liga(e); });
  el.addEventListener('pointerup', desliga);
  el.addEventListener('pointercancel', desliga);
  el.addEventListener('lostpointercapture', desliga);
});

function soltarTudo() {
  Object.keys(teclas).forEach(k => {
    teclas[k] = false;
    document.querySelector('[data-k="' + k + '"]').classList.remove('ativa');
  });
  passo();
}

document.addEventListener('visibilitychange', () => { if (document.hidden) soltarTudo(); });
window.addEventListener('blur', soltarTudo);

function acionar(id, letra, rotulo) {
  mandar(letra);
  recado(rotulo + ' — em andamento.');
  const b = $(id);
  b.classList.add('ativo');
  setTimeout(() => b.classList.remove('ativo'), 700);
}

$('bt-a').addEventListener('click', () => acionar('bt-a', 'a', rotulos['rot-a']));
$('bt-b').addEventListener('click', () => acionar('bt-b', 'b', rotulos['rot-b']));
$('bt-ab').addEventListener('click', () => acionar('bt-ab', 'd', rotulos['rot-ab']));
$('parar').addEventListener('click', () => { soltarTudo(); mandar('z'); recado('Tudo parado.'); });

$('conectar').addEventListener('click', () => ligado ? desconectar() : conectar());

$('s-vel').addEventListener('input', e => { $('n-vel').textContent = e.target.value; pintar(digito()); });
$('s-vel').addEventListener('change', e => mandar('v' + e.target.value));
$('s-giro').addEventListener('input', e => { $('n-giro').textContent = e.target.value; pintar(digito()); });
$('s-giro').addEventListener('change', e => mandar('g' + e.target.value));

Object.keys(rotulos).forEach(id => { $(id).textContent = rotulos[id]; });

if (url.get('senha')) {
  $('senha').value = url.get('senha').toUpperCase();
}

pintar('5');
estado(false, 'Desconectado');
</script>
</body>
</html>
